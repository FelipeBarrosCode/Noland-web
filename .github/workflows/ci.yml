name: Web CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: npm ci
      - run: npm run build
      - run: npm run i18n:check
      - name: Check Noland Helper Rust bridge
        env:
          NOLAND_SKIP_NATIVE_BUILD: "1"
          TAURI_CONFIG: '{"build":{"frontendDist":"ci-dist"},"bundle":{"externalBin":[],"resources":[]}}'
        run: |
          mkdir -p src-tauri/ci-dist
          cargo check --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets
      - name: Validate gateway installer
        run: bash -n instance-gateway/install.sh
      - name: Validate Worker bundle
        run: npx --yes wrangler deploy --dry-run --config worker/wrangler.jsonc
      - name: Ensure browser backend coverage does not regress
        run: node scripts/check-web-command-coverage.mjs
